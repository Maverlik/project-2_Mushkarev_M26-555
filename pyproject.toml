[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная база данных с таблицами, CRUD и JSON-хранилищем"
readme = "README.md"
authors = [
    { name = "Mushkarev" }
]
requires-python = ">=3.12"
dependencies = ["prettytable>=3.16.0,<4", "prompt>=0.4.1,<0.5"]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[dependency-groups]
dev = ["ruff==0.12.1"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
